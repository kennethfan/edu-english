name: Android Release

# 推送 v* 标签（如 v0.1.1）自动打包 APK 并发 GitHub Release；也可手动触发
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 master
        uses: actions/checkout@v4

      # 发音音频不入 master（.gitignore），从 gh-pages 分支取网页版同源 ogg
      - name: 检出音频（gh-pages）
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: ghpages
          sparse-checkout: audio

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 补齐发音音频
        run: mkdir -p www/audio && cp ghpages/audio/*.ogg www/audio/

      - name: 构建 Web 资产并同步到 Android
        run: |
          npm ci
          npm run sync

      - name: 注入版本号（tag → versionName）
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${V}\"/" android/app/build.gradle
          grep versionName android/app/build.gradle

      - name: Gradle 打包（debug 签名，可直接安装）
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 整理 APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/单词对对碰-${{ github.ref_name }}.apk"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
